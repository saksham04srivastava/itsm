server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chat attachments and signoff documents. Kept above the backend's own 25 MB
    # cap so oversized uploads get the API's JSON error, not nginx's HTML 413.
    client_max_body_size 30m;

    # Enable detailed error logging
    error_log  /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS headers (belt-and-suspenders)
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
    }

    # Serve frontend SPA — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
