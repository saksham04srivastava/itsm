services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fieldops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fieldops
      POSTGRES_USER:     fieldops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldops123}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - fieldops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fieldops-backend
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql://fieldops:${DB_PASSWORD:-fieldops123}@db:5432/fieldops
      SECRET_KEY:    ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fieldops-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Nginx + Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fieldops-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fieldops-net

volumes:
  db_data:
    name: fieldops-db-data        # ← all your data persists here
  uploads_data:
    name: fieldops-uploads        # ← all uploaded files persist here

networks:
  fieldops-net:
    name: fieldops-network
    driver: bridge
